name: Verify Water Chemistry production after main publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-chemistry-production-health
  cancel-in-progress: true

jobs:
  semantic_health:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Connect Cloud and verify semantic markers
        env:
          SMOKE_MAX_ATTEMPTS: "9"
          SMOKE_SLEEP_BASE: "20"
          SMOKE_CONNECT_TIMEOUT: "10"
          SMOKE_MAX_TIME: "30"
        run: |
          export SMOKE_APP_RECEIPT
          SMOKE_APP_RECEIPT=$(jq -r '[.files | to_entries | sort_by(.key)[] | .value.checksum] | join(".")' manifest.json)
          test -n "$SMOKE_APP_RECEIPT"
          sleep 45
          bash scripts/post_deploy_smoke.sh \
            "Connect Cloud app=https://019ebf59-b2ff-a20a-cb35-6d227ca6261a.share.connect.posit.cloud/" \
            "GitHub Pages landing=https://tgilbert14.github.io/NEON-WaterChemistry-Analyte-Viewer-App/"

      - name: Install the pinned browser smoke
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Drive a live Shiny session in a browser
        run: node scripts/browser_smoke.mjs "https://019ebf59-b2ff-a20a-cb35-6d227ca6261a.share.connect.posit.cloud/"

      - name: Open or update the production outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Water Chemistry semantic smoke failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="Main publication ${GITHUB_SHA} did not pass semantic production health after the cold-start budget. Run: ${run_url}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved production outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Water Chemistry semantic smoke failed"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$number" --comment "Semantic production health recovered at ${GITHUB_SHA}. Evidence: ${run_url}"
          fi

      - name: Close the refresh-ready issue once main holds the review branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/water-chemistry-data-refresh
        run: |
          # Bookkeeping only: an API failure here is a warning, never a red deploy check.
          set -uo pipefail
          title="Water Chemistry refresh ready for review"
          if ! number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --limit 50 \
                | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty'); then
            echo "::warning title=Refresh-ready issue not checked::Could not list issues."
            exit 0
          fi
          [ -n "$number" ] || exit 0
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          err=$(mktemp)
          if status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BRANCH...$GITHUB_SHA" --jq '.status' 2>"$err"); then
            if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
              gh issue close "$number" --comment "Main at ${GITHUB_SHA} contains \`$BRANCH\` and passed production health. Evidence: ${run_url}" \
                || echo "::warning title=Refresh-ready issue not closed::Could not close issue #$number."
            else
              echo "Refresh-ready issue #$number stays open: $BRANCH is $status relative to $GITHUB_SHA."
            fi
          elif grep -q "Not Found" "$err"; then
            gh issue close "$number" --comment "The \`$BRANCH\` branch no longer exists, so no refresh is waiting. Main at ${GITHUB_SHA} passed production health. Evidence: ${run_url}" \
              || echo "::warning title=Refresh-ready issue not closed::Could not close issue #$number."
          else
            echo "::warning title=Refresh-ready issue not checked::Could not compare $BRANCH with $GITHUB_SHA: $(head -c 300 "$err")"
          fi
